<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#102a43">
    <link rel="icon" href="image/logo.png">
	<title>SHIBUST | Result Portal</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Inter, "Segoe UI", Arial, sans-serif;
			color: #172b4d;
			background: #f2f6fb;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: radial-gradient(circle at 15% 10%, #dcecff 0, transparent 34%),
									radial-gradient(circle at 90% 90%, #d9f1e8 0, transparent 30%), #f5f8fc;
		}
		.portal {
			width: min(100%, 450px);
			padding: clamp(28px, 7vw, 48px);
			background: #fff;
			border: 1px solid #e4ebf3;
			border-radius: 20px;
			box-shadow: 0 22px 60px rgba(16, 42, 67, .12);
		}
		.mark {
			width: 52px;
			height: 52px;
			display: grid;
			place-items: center;
			margin-bottom: 24px;
			border-radius: 15px;
			background: #e8f1ff;
			color: #1761b0;
			font-size: 20px;
			font-weight: 800;
			letter-spacing: -.06em;
		}
		.eyebrow { margin: 0 0 8px; color: #1761b0; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
		h1 { margin: 0; color: #102a43; font-size: clamp(27px, 6vw, 34px); letter-spacing: -.04em; }
		.intro { margin: 12px 0 28px; color: #62758b; line-height: 1.6; }
		label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 700; }
		input {
			width: 100%;
			min-height: 52px;
			padding: 0 15px;
			border: 1px solid #cbd6e2;
			border-radius: 10px;
			color: #172b4d;
			font: inherit;
			outline: none;
			transition: border-color .2s, box-shadow .2s;
		}
		input:focus { border-color: #2878c7; box-shadow: 0 0 0 3px rgba(40, 120, 199, .15); }
		input::placeholder { color: #9aa9b8; }
		button {
			width: 100%;
			min-height: 52px;
			margin-top: 16px;
			border: 0;
			border-radius: 10px;
			background: #1761b0;
			color: #fff;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
			transition: background .2s, transform .2s;
		}
		button:hover { background: #104d91; }
		button:active { transform: translateY(1px); }
		.message { min-height: 22px; margin: 12px 0 0; color: #b42318; font-size: 14px; }
		.hint { margin: 15px 0 0; color: #8291a2; font-size: 12px; line-height: 1.5; }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
	</style>
</head>
<body>
	<main class="portal">
		<div class="mark" aria-hidden="true">S</div>
		<p class="eyebrow">SHIBUST</p>
		<h1>Semester Result Portal</h1>
		<p class="intro">Enter your portal access code to continue to the right dashboard.</p>

		<form id="access-form">
			<label for="access-code">Access code</label>
			<input id="access-code" name="access-code" type="password" autocomplete="off" placeholder="Enter your code" required aria-describedby="access-message">
			<button type="submit">Continue</button>
			<p class="message" id="access-message" role="alert" aria-live="polite"></p>
		</form>
		<p class="hint">If you do not have an access code, contact your school administrator.</p>
	</main>

	<script>
		// Demo-only codes. Replace these with server-side authentication before deployment.
		const ACCESS_CODES = {
			'SHIBUST-ADMIN': 'admin.html',
			'SHIBUST-STUDENT': 'student.html'
		};

		document.getElementById('access-form').addEventListener('submit', (event) => {
			event.preventDefault();
			const code = document.getElementById('access-code').value.trim().toUpperCase();
			const destination = ACCESS_CODES[code];
			const message = document.getElementById('access-message');

			if (!destination) {
				message.textContent = 'That access code is not recognized. Please check it and try again.';
				return;
			}

			window.location.href = destination;
		});
	</script>
</body>
</html>
